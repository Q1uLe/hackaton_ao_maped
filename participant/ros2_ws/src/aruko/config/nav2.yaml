bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: trunk
    odom_topic: /odom
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_rate_controller_bt_node
      - nav2_recovery_node_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_spin_action_bt_node
      - nav2_back_up_action_bt_node

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    planner_plugins: [GridBased, NavFn]
    GridBased:
      plugin: nav2_smac_planner/SmacPlanner2D
      tolerance: 0.22
      allow_unknown: true
      max_planning_time: 0.8
      cost_travel_multiplier: 3.0
      use_final_approach_orientation: false
    NavFn:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.22
      allow_unknown: true
      use_astar: true
      use_final_approach_orientation: false

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 15.0
    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.01
    min_theta_velocity_threshold: 0.01
    failure_tolerance: 1.0
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.10
      movement_time_allowance: 16.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.20
      stateful: true
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.25
      lookahead_dist: 0.42
      use_velocity_scaled_lookahead_dist: false
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.50
      rotate_to_heading_angular_vel: 0.55
      max_angular_accel: 1.2
      min_approach_linear_velocity: 0.08
      approach_velocity_scaling_dist: 0.60
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.4
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.38
      inflation_cost_scaling_factor: 4.0
      regulated_linear_scaling_min_speed: 0.09
      transform_tolerance: 0.30

behavior_server:
  ros__parameters:
    use_sim_time: true
    global_frame: odom
    robot_base_frame: trunk
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    behavior_plugins: [wait, spin, backup]
    max_rotational_vel: 0.55
    min_rotational_vel: 0.22
    rotational_acc_lim: 1.2
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    wait:
      plugin: nav2_behaviors/Wait

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: trunk
      transform_tolerance: 0.30
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      update_frequency: 10.0
      publish_frequency: 3.0
      footprint: '[[0.36,0.22],[0.36,-0.22],[-0.36,-0.22],[-0.36,0.22]]'
      footprint_padding: 0.02
      plugins: [obstacles, inflation]
      obstacles:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /course/scan
          data_type: LaserScan
          marking: true
          clearing: true
          inf_is_valid: true
          obstacle_max_range: 4.0
          raytrace_max_range: 5.0
      inflation:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.48
        cost_scaling_factor: 4.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: trunk
      transform_tolerance: 0.40
      resolution: 0.05
      update_frequency: 2.0
      publish_frequency: 1.0
      footprint: '[[0.36,0.22],[0.36,-0.22],[-0.36,-0.22],[-0.36,0.22]]'
      footprint_padding: 0.02
      track_unknown_space: true
      plugins: [static, inflation]
      static:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /planning_map
        map_subscribe_transient_local: true
      inflation:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.48
        cost_scaling_factor: 4.0
