slam_toolbox:
  ros__parameters:
    use_sim_time: true
    mode: mapping
    odom_frame: odom
    map_frame: map
    base_frame: trunk
    scan_topic: /course/scan
    resolution: 0.05
    map_update_interval: 1.0
    transform_publish_period: 0.05
    transform_timeout: 0.3
    minimum_time_interval: 0.16
    minimum_travel_distance: 0.12
    minimum_travel_heading: 0.14
    use_scan_matching: true
    use_scan_barycenter: true
    do_loop_closing: true
    throttle_scans: 1
    scan_queue_size: 1
    max_laser_range: 10.0
    solver_plugin: solver_plugins::CeresSolver
